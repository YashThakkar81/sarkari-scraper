name: Scheduled Job Scraper

# Manual only: no automatic timing. Start it from the Actions tab -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap (a second run waits for the first one).
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    # Runs on your own Windows PC in India (the runner named india-pc).
    # To go back to GitHub's servers: runs-on: ubuntu-latest, and change the "shell:" line below to "shell: bash".
    runs-on: [self-hosted, windows]
    timeout-minutes: 45

    # -ExecutionPolicy Bypass: Windows' "scripts are disabled" setting can no longer stop the steps.
    defaults:
      run:
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Finds a working Python on the PC (python, the "py" launcher, or the usual install folders)
      # and remembers its full path for the next steps. Prints what it finds so problems are easy to read.
      - name: Find Python
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "PATH entries mentioning Python:"
          ($env:PATH -split ';') | Where-Object { $_ -match 'Python' } | ForEach-Object { Write-Host "  $_" }
          $found = $null
          foreach ($name in @('python', 'py')) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd -and $cmd.Source) {
              $pyArgs = @()
              if ($name -eq 'py') { $pyArgs = @('-3') }
              $out = & $cmd.Source @pyArgs -c "import sys; print(sys.executable)" 2>$null
              if ($LASTEXITCODE -eq 0 -and $out) { $found = ($out | Select-Object -First 1).Trim(); break }
              Write-Host "'$name' exists at $($cmd.Source) but did not run (probably the Microsoft Store shortcut)."
            }
          }
          if (-not $found) {
            $paths = @(Get-ChildItem "$env:LOCALAPPDATA\Programs\Python\Python3*\python.exe", "C:\Program Files\Python3*\python.exe", "C:\Python3*\python.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending)
            if ($paths.Count -gt 0) { $found = $paths[0].FullName }
          }
          if (-not $found) {
            Write-Host "ERROR: no working Python found on this PC. Install Python 3.11+ from python.org (tick 'Add python.exe to PATH'), then restart the runner."
            exit 1
          }
          Write-Host "Using Python: $found"
          "PYEXE=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $found --version

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:PYEXE -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Browser reader (Playwright). It uses the Google Chrome installed on this PC. If this step fails,
          # the scraper still runs; it just cannot open blocked or JavaScript-only pages.
          & $env:PYEXE -m pip install playwright
          if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: could not install playwright; continuing without the browser reader." }
          exit 0

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          MAX_PDFS_PER_PAGE: "2"
          # FORCE_RECHECK: "mppsc.mp.gov.in"   # optional: check a website's files again even if seen before
          # MAX_GEMINI_PER_RUN: "20"      # remove the # to check more portals per run (uses more Gemini quota)
          # USE_BROWSER: "0"             # remove the # to switch the browser reader off
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:PYEXE auto_scraper.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Saves the "already seen" list. Pulls first and retries, so a change made to the repo
      # while the scraper was running can no longer make this step fail.
      - name: Save seen list back to repo
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          git --version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          foreach ($f in @("seen_notifications.json", "needs_review.log")) {
            if (Test-Path $f) { git add $f }
          }
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Nothing to save."; exit 0 }
          git commit -m "Update seen list"
          $branch = $env:GITHUB_REF_NAME
          for ($i = 1; $i -le 5; $i++) {
            git pull --rebase --autostash -X theirs origin $branch
            if ($LASTEXITCODE -eq 0) {
              git push origin "HEAD:$branch"
              if ($LASTEXITCODE -eq 0) { Write-Host "Seen list saved."; exit 0 }
            }
            Write-Host "Push attempt $i failed; trying again in 5 seconds..."
            Start-Sleep -Seconds 5
          }
          Write-Host "Could not save the seen list after 5 tries."
          exit 1
