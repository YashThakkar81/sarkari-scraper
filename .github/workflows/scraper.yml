name: Scheduled Job Scraper

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap (a second run waits for the first one).
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    # Runs on your own Windows PC in India (the runner named india-pc).
    # To go back to GitHub's servers, change this line to:  runs-on: ubuntu-latest
    runs-on: [self-hosted, windows]
    timeout-minutes: 45

    defaults:
      run:
        shell: bash          # Git for Windows provides bash, so the steps below work on Windows

    env:
      PYTHONUTF8: "1"                # lets Python print Hindi / the rupee sign in the Windows log
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses the Python you installed on the PC (no setup-python needed on a self-hosted runner).
      - name: Check Python
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          MAX_PDFS_PER_PAGE: "2"
        run: python auto_scraper.py

      # Saves the "already seen" list. Pulls first and retries, so a change made to the repo
      # while the scraper was running (for example a file you uploaded) can no longer make this step fail.
      - name: Save seen list back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          for f in seen_notifications.json needs_review.log; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Nothing to save."
            exit 0
          fi
          git commit -m "Update seen list"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Seen list saved."
              exit 0
            fi
            echo "Push attempt $i failed; trying again in 5 seconds..."
            sleep 5
          done
          echo "Could not save the seen list after 5 tries."
          exit 1
