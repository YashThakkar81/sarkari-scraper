name: Scheduled Job Scraper

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap (a second run waits for the first one).
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    # Runs on your own Windows PC in India (the runner named india-pc).
    # To go back to GitHub's servers, change this line to:  runs-on: ubuntu-latest
    # (and change every "shell: powershell" below to "shell: bash")
    runs-on: [self-hosted, windows]
    timeout-minutes: 45

    # Windows PowerShell is built into Windows, so no extra program has to be found.
    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: "1"                # lets Python print Hindi / the rupee sign in the Windows log
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses the Python installed on the PC (no setup-python needed on a self-hosted runner).
      - name: Check Python
        run: |
          $ErrorActionPreference = 'Continue'
          python --version
          if ($LASTEXITCODE -ne 0) { Write-Host "Python was not found by the runner."; exit 1 }
          python -m pip --version
          if ($LASTEXITCODE -ne 0) { Write-Host "pip was not found."; exit 1 }

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          MAX_PDFS_PER_PAGE: "2"
        run: |
          $ErrorActionPreference = 'Continue'
          python auto_scraper.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Saves the "already seen" list. Pulls first and retries, so a change made to the repo
      # while the scraper was running can no longer make this step fail.
      - name: Save seen list back to repo
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          foreach ($f in @("seen_notifications.json", "needs_review.log")) {
            if (Test-Path $f) { git add $f }
          }
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Nothing to save."; exit 0 }
          git commit -m "Update seen list"
          $branch = $env:GITHUB_REF_NAME
          for ($i = 1; $i -le 5; $i++) {
            git pull --rebase --autostash -X theirs origin $branch
            if ($LASTEXITCODE -eq 0) {
              git push origin "HEAD:$branch"
              if ($LASTEXITCODE -eq 0) { Write-Host "Seen list saved."; exit 0 }
            }
            Write-Host "Push attempt $i failed; trying again in 5 seconds..."
            Start-Sleep -Seconds 5
          }
          Write-Host "Could not save the seen list after 5 tries."
          exit 1
